worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout main;

  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/nginx-client;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Route redirects (e.g. /read -> /read/) must stay relative so they keep
    # working behind a port mapping or a reverse proxy.
    absolute_redirect off;

    # SHA-256 hashes of this build's inline <script> tags, written by
    # scripts/csp-hashes.mjs during `npm run generate`. The repo holds the
    # policy; only the per-build hash list varies.
    set $csp_script_hashes '';
    include /etc/nginx/csp-hashes.conf;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_script_hashes; img-src * data: blob:; connect-src *; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin always;

    # Security headers live only in this server block: any add_header in a
    # location would silently replace them, so locations use `expires`, which
    # sets Cache-Control without add_header.

    location ~ \.html$ {
      expires -1;
      try_files $uri =404;
    }

    # nginx has no built-in type for Markdown; the reader only fetches
    # responses whose content type is text/*, so label it explicitly.
    location ~* \.(?:md|markdown)$ {
      types {
        text/markdown md;
        text/markdown markdown;
      }
      default_type text/markdown;
      try_files $uri =404;
    }

    location ^~ /_nuxt/ {
      expires 1y;
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
